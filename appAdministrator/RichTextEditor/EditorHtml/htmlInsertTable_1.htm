<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" >
<head>
    <title>Insert Table</title>
    <link type="text/css" rel="stylesheet" href="../EditorCSS/StyleSheet_1.css" />
    <script language="javascript" type="text/javascript" src="../EditorScripts/GlobalVar_1.js"></script>
    <script language="javascript" type="text/javascript" src="../EditorScripts/HtmlInsert_1.js"></script>
</head>
<body bgcolor="#EEEEEE">

		<table border="0" cellpadding="0" cellspacing="0" style="width:100%;padding: 10px;" class="bodytext_1">
			<tr>
				<td>
					<span style=" font-weight: bold;">Table Properties:</span>

					<table style="width:100%;" border="0" cellpadding="1" cellspacing="0">
						<tr>
							<td style="width: 20%;">
								Rows:
							</td>
							<td style="width: 25%;">
								<input type="text" size="4" id="txtTblInsrt_Row" name="rows" value="2" style="width: 50px;" class="bodytext_1" />
							</td>
							<td style="width: 25%;">
								Width:
							</td>
							<td style="width: 30%;">
								<input type="text" name="width" id="txtTblInsrt_Width" value="100" size="10" style="width: 50px;" class="bodytext_1" />
								<select name="widthType" id="txtTblInsrt_WidthType"
									style="margin-right: 10px; font-size: 10px;" class="bodytext_1">
									<option value="%">%</option>
									<option value="px">px</option>
								</select>
							</td>
						</tr>
						<tr>
							<td>
								Cols:
							</td>
							<td>
								<input type="text" size="4" id="txtTblInsrt_Cols" name="cols" value="2"	style="width: 50px;" class="bodytext_1" />
							</td>
							<td>
								Alignment:
							</td>
							<td>
								<select name="alignment" id="txtTblInsrt_Alignment" style="margin-right: 10px; width: 95px;" class="bodytext_1">
									<option value="">Not Set</option>
									<option value="left">Left</option>
									<option value="right">Right</option>
									<option value="center">Center</option>
								</select>
							</td>
						</tr>
						<tr>
							<td>
								Padding:
							</td>
							<td>
								<input type="text" id="txtTblInsrt_Padding" name="padding" value="2" style="width: 50px;" class="bodytext_1" />
							</td>
							<td>
								Background-Color:
							</td>
							<td>
								<table border="0" cellpadding="0" cellspacing="0">
									<tr>
										<td width="25">
											<table border="0" cellpadding="0" cellspacing="0">
												<tr>
													<td>
														<input type="text" name="backgroundcolor" id="backgroundcolor" value="none" style="width:50px;" class="bodytext_1" />
													</td>
												</tr>
											</table>
										</td>
										<td>
											<button style="margin-left:2px; display:none;">
												Choose</button>
										</td>
									</tr>
								</table>
							</td>
						</tr>
						<tr>
						<td>
                            Border-Width:
						</td>
						<td>
							<input type="text" size="4" id="txtTblInsrt_BorderSize" name="border" value="0" style="width: 50px;" class="bodytext_1" />
						</td>
						<td>
							Border-Color:
						</td>
						<td>
							<table border="0" cellpadding="0" cellspacing="0">
								<tr>
									<td width="25">
										<table border="0" cellpadding="0" cellspacing="0">
											<tr>
												<td>												
													<input type="text" name="bordercolor" id="bordercolor" value="none" style="width:50px;" class="bodytext_1" />
												</td>
											</tr>
										</table>
									</td>
									<td>
										<button style="margin-left: 2px; display:none;">
											Choose</button>
									</td>
								</tr>
							</table>
						</td>
					</tr>
					<tr>
						<td>
							Border-Style:
						</td>
						<td>
							<select id="txtTblInsrt_BorderStyle" name="borderstyle" style="width: 80px;" class="bodytext_1">
								<option value="none">none</option>
								<option value="solid">solid</option>
								<option value="double">double</option>
								<option value="dotted">dotted</option>
								<option value="dashed">dashed</option>
								<option value="groove">groove</option>
								<option value="ridge">ridge</option>
								<option value="inset">inset</option>
								<option value="outset">outset</option>
							</select>
						</td>
						<td>
							<span style="display:none;">Border-Collapse:</span>
						</td>
						<td>
							<span style="display:none;"><input type="checkbox" name="bordercollapse" id="bordercollapse" class="bodytext_1" /></span>
						</td>
					</tr>
				</table>
			</td>
		</tr>
		</table>
			<div align="right">
				<input type="submit" value="  Submit  " onclick="funHtmCreateTable_1();"
					style="font-size: 12px;" class="bodytext_1" />
				&nbsp;
				<input type="submit" value="  Cancel  " onclick="window.close();"
					style="font-size: 12px; margin-right: 15px;" class="bodytext_1" />
			</div>
				
	</body>
</html>
